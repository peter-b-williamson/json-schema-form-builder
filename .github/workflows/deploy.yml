name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: form-generator/.nvmrc
          cache: npm
          cache-dependency-path: form-generator/package-lock.json

      - name: Install dependencies
        working-directory: form-generator
        run: npm ci

      - name: Build
        working-directory: form-generator
        env:
          VITE_BASE_PATH: /js-schema-form-generator/
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: form-generator/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
