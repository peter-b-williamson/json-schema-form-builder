name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: form-builder / lint
            directory: form-builder
            command: npm run lint:check && npm run format:check
          - name: form-builder / type-check
            directory: form-builder
            command: npm run type-check
          - name: form-builder / test
            directory: form-builder
            command: npm run test:unit
          - name: form-builder / build
            directory: form-builder
            command: npm run build
          - name: form-builder / e2e
            directory: form-builder
            command: npm run test:e2e
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ matrix.directory }}/.nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci

      - name: Run checks
        working-directory: ${{ matrix.directory }}
        run: ${{ matrix.command }}
